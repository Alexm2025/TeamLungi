# Builds the frontend and publishes it to GitHub Pages on every push to main,
# so the whole team can open the latest UI at https://alexm2025.github.io/TeamLungi/
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The site lives under /TeamLungi/, so assets need that base path.
      # Contract address and deploy block come from repo variables, so redeploying the contract
      # needs no code change. The deploy block lets the activity feed skip older chain history.
      - run: npx vite build --base=/TeamLungi/
        env:
          VITE_CONTRACT_ADDRESS: ${{ vars.VITE_CONTRACT_ADDRESS }}
          VITE_DEPLOY_BLOCK: ${{ vars.VITE_DEPLOY_BLOCK }}
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}

      # GitHub Pages has no SPA routing: serving index.html as the 404 page lets
      # deep links like /TeamLungi/verify/BATCH-001 load the app instead of an error.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
